  <!-- text -->
  <text x="460" y="270" font-family="DejaVu Sans, Nunito, Arial, sans-serif" font-weight="700" font-size="80" fill="#E8734A">Гушни</text>
  <g transform="translate(778,222) scale(1.7) rotate(-8)" fill="#3D2B22">
    <ellipse cx="0" cy="18" rx="16" ry="20" />
    <ellipse cx="-22" cy="-6" rx="8" ry="10" />
    <ellipse cx="-9" cy="-22" rx="8" ry="10" />
    <ellipse cx="9" cy="-22" rx="8" ry="10" />
    <ellipse cx="22" cy="-6" rx="8" ry="10" />
  </g>
  <text x="463" y="335" font-family="DejaVu Sans, Nunito, Arial, sans-serif" font-weight="600" font-size="36" fill="#3D2B22">Пет котенца търсят</text>
  <text x="463" y="380" font-family="DejaVu Sans, Nunito, Arial, sans-serif" font-weight="600" font-size="36" fill="#3D2B22">своя завинаги дом</text>
  <text x="463" y="440" font-family="DejaVu Sans, Nunito, Arial, sans-serif" font-size="27" fill="#6B5647">Спасени. Обичани. Търсещи семейство.</text>
  <text x="463" y="500" font-family="DejaVu Sans, Nunito, Arial, sans-serif" font-weight="600" font-size="27" fill="#C65A35">gushni.me</text>

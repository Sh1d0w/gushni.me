  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- decorative paw prints -->
  <g fill="#E8734A" opacity="0.18">
    <g transform="translate(80,80) scale(1.3) rotate(-18)">
      <ellipse cx="0" cy="18" rx="16" ry="20" />
      <ellipse cx="-22" cy="-6" rx="8" ry="10" />
      <ellipse cx="-9" cy="-22" rx="8" ry="10" />
      <ellipse cx="9" cy="-22" rx="8" ry="10" />
      <ellipse cx="22" cy="-6" rx="8" ry="10" />
    </g>
    <g transform="translate(1080,540) scale(1.6) rotate(12)">
      <ellipse cx="0" cy="18" rx="16" ry="20" />
      <ellipse cx="-22" cy="-6" rx="8" ry="10" />
      <ellipse cx="-9" cy="-22" rx="8" ry="10" />
      <ellipse cx="9" cy="-22" rx="8" ry="10" />
      <ellipse cx="22" cy="-6" rx="8" ry="10" />
    </g>
    <g transform="translate(1120,90) scale(1.1) rotate(24)">
      <ellipse cx="0" cy="18" rx="16" ry="20" />
      <ellipse cx="-22" cy="-6" rx="8" ry="10" />
      <ellipse cx="-9" cy="-22" rx="8" ry="10" />

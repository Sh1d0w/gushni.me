      <ellipse cx="22" cy="-6" rx="8" ry="10" />
    </g>
  </g>

  <!-- cat face -->
  <g transform="translate(150,190)">
    <circle cx="100" cy="120" r="120" fill="#F6C6A0" />
    <path d="M45 45 L70 95 L30 100 Z" fill="#E8734A" />
    <path d="M155 45 L170 100 L130 95 Z" fill="#E8734A" />
    <circle cx="100" cy="140" r="65" fill="#FDF6EC" />
    <circle cx="76" cy="128" r="7" fill="#3D2B22" />
    <circle cx="124" cy="128" r="7" fill="#3D2B22" />
    <path d="M88 150 Q100 160 112 150" stroke="#3D2B22" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M100 145 L95 152 L105 152 Z" fill="#E8734A" />
